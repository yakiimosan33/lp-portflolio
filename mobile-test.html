<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モバイルテストツール</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        
        .test-container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .device-selector {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .device-btn {
            padding: 10px 15px;
            background: #0057FF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .device-btn.active {
            background: #4CAF50;
        }
        
        .test-frame-container {
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            margin: 20px 0;
            transition: all 0.3s ease;
        }
        
        .test-frame {
            width: 100%;
            height: 600px;
            border: none;
            display: block;
        }
        
        .test-results {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .test-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        
        .test-item:last-child {
            border-bottom: none;
        }
        
        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .pass { background: #4CAF50; }
        .fail { background: #f44336; }
        .warning { background: #FF9800; }
        
        .device-info {
            background: #333;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>📱 モバイル対応テストツール</h1>
        
        <div class="device-selector">
            <button class="device-btn active" onclick="setDevice('full')">フルサイズ</button>
            <button class="device-btn" onclick="setDevice('iphone14')">iPhone 14 (390x844)</button>
            <button class="device-btn" onclick="setDevice('iphone14plus')">iPhone 14 Plus (428x926)</button>
            <button class="device-btn" onclick="setDevice('galaxys22')">Galaxy S22 (360x780)</button>
            <button class="device-btn" onclick="setDevice('ipadmini')">iPad mini (768x1024)</button>
            <button class="device-btn" onclick="setDevice('small')">小型端末 (320x568)</button>
        </div>
        
        <div class="device-info" id="deviceInfo">
            現在のテストサイズ: フルサイズ
        </div>
        
        <div class="test-frame-container" id="frameContainer">
            <iframe class="test-frame" id="testFrame" src="index.html"></iframe>
        </div>
        
        <button onclick="runMobileTests()" style="background: #4CAF50; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 20px 0;">
            モバイルテストを実行
        </button>
        
        <div class="test-results" id="testResults">
            <h2>📋 テスト結果</h2>
            <div id="testOutput">テストを実行してください...</div>
        </div>
        
        <div class="test-results">
            <h3>🎯 手動確認項目</h3>
            <div class="test-item">
                <span>ヘッダーナビゲーションが縦並びになる</span>
                <span class="status" onclick="toggleStatus(this)">未確認</span>
            </div>
            <div class="test-item">
                <span>フィルタリングボタンが適切に折り返す</span>
                <span class="status" onclick="toggleStatus(this)">未確認</span>
            </div>
            <div class="test-item">
                <span>ポートフォリオグリッドが1-2カラムになる</span>
                <span class="status" onclick="toggleStatus(this)">未確認</span>
            </div>
            <div class="test-item">
                <span>タッチスクロールが滑らか</span>
                <span class="status" onclick="toggleStatus(this)">未確認</span>
            </div>
            <div class="test-item">
                <span>外部リンクが正常にタップできる</span>
                <span class="status" onclick="toggleStatus(this)">未確認</span>
            </div>
            <div class="test-item">
                <span>フォントサイズが読みやすい</span>
                <span class="status" onclick="toggleStatus(this)">未確認</span>
            </div>
            <div class="test-item">
                <span>ボタンのタップ領域が十分</span>
                <span class="status" onclick="toggleStatus(this)">未確認</span>
            </div>
        </div>
    </div>
    
    <script>
        const devices = {
            full: { width: '100%', height: '600px', name: 'フルサイズ' },
            iphone14: { width: '390px', height: '844px', name: 'iPhone 14 (390x844)' },
            iphone14plus: { width: '428px', height: '926px', name: 'iPhone 14 Plus (428x926)' },
            galaxys22: { width: '360px', height: '780px', name: 'Galaxy S22 (360x780)' },
            ipadmini: { width: '768px', height: '1024px', name: 'iPad mini (768x1024)' },
            small: { width: '320px', height: '568px', name: '小型端末 (320x568)' }
        };
        
        function setDevice(deviceId) {
            const device = devices[deviceId];
            const container = document.getElementById('frameContainer');
            const frame = document.getElementById('testFrame');
            const info = document.getElementById('deviceInfo');
            
            // ボタンの状態更新
            document.querySelectorAll('.device-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // フレームサイズ変更
            if (deviceId === 'full') {
                container.style.width = '100%';
                frame.style.height = '600px';
            } else {
                container.style.width = device.width;
                container.style.margin = '20px auto';
                frame.style.height = device.height;
            }
            
            info.textContent = `現在のテストサイズ: ${device.name}`;
        }
        
        function runMobileTests() {
            const iframe = document.getElementById('testFrame');
            const testOutput = document.getElementById('testOutput');
            
            // iframe再読み込み
            iframe.src = iframe.src;
            
            iframe.onload = function() {
                setTimeout(() => {
                    let results = '';
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // 基本要素の存在確認
                    const header = doc.querySelector('.header');
                    const filterTags = doc.querySelectorAll('.filter-tag');
                    const portfolioItems = doc.querySelectorAll('.portfolio-grid-item');
                    const portfolioGrid = doc.querySelector('.portfolio-grid');
                    
                    // テスト実行
                    results += testElement('ヘッダー要素', header);
                    results += testElement('フィルタータグ', filterTags.length > 0);
                    results += testElement('ポートフォリオアイテム', portfolioItems.length > 0);
                    results += testElement('グリッドコンテナ', portfolioGrid);
                    
                    // レスポンシブテスト
                    const viewportWidth = iframe.contentWindow.innerWidth;
                    results += testCondition('ビューポート幅認識', viewportWidth > 0, `${viewportWidth}px`);
                    
                    // CSS適用確認
                    if (portfolioGrid) {
                        const gridStyle = iframe.contentWindow.getComputedStyle(portfolioGrid);
                        const gridColumns = gridStyle.gridTemplateColumns;
                        results += testCondition('グリッドカラム設定', gridColumns.includes('fr'), gridColumns);
                    }
                    
                    // カスタムカーソル非表示確認（モバイル）
                    if (viewportWidth < 768) {
                        const cursor = doc.querySelector('.cursor-dot');
                        if (cursor) {
                            const cursorStyle = iframe.contentWindow.getComputedStyle(cursor);
                            results += testCondition('カスタムカーソル非表示', 
                                cursorStyle.display === 'none', 
                                cursorStyle.display
                            );
                        }
                    }
                    
                    testOutput.innerHTML = results;
                }, 1000);
            };
        }
        
        function testElement(name, element) {
            const status = element ? '✅ PASS' : '❌ FAIL';
            return `<div class="test-item"><span>${name}</span><span class="status ${element ? 'pass' : 'fail'}">${status}</span></div>`;
        }
        
        function testCondition(name, condition, value = '') {
            const status = condition ? '✅ PASS' : '❌ FAIL';
            const valueText = value ? ` (${value})` : '';
            return `<div class="test-item"><span>${name}${valueText}</span><span class="status ${condition ? 'pass' : 'fail'}">${status}</span></div>`;
        }
        
        function toggleStatus(element) {
            const statuses = ['未確認', '✅ PASS', '❌ FAIL', '⚠️ 問題あり'];
            const classes = ['', 'pass', 'fail', 'warning'];
            const currentIndex = statuses.indexOf(element.textContent);
            const nextIndex = (currentIndex + 1) % statuses.length;
            
            element.textContent = statuses[nextIndex];
            element.className = 'status ' + classes[nextIndex];
        }
        
        // 初期テスト実行
        setTimeout(() => {
            runMobileTests();
        }, 1000);
    </script>
</body>
</html>
