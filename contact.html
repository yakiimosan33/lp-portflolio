<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Vibe Coding Portfolio</title>
    <meta name="description" content="Vibe Codingへのお問い合わせページ。AIを活用したクリエイティブな制作についてお気軽にご相談ください。">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
</head>
<body>
    <!-- Custom Cursor -->
    <div class="cursor-dot-outline"></div>
    <div class="cursor-dot"></div>

    <!-- Header -->
    <header class="header">
        <a href="index.html" class="logo">Vibe Coding</a>
        <nav class="header-nav">
            <ul class="header-nav-list">
                <li class="header-nav-item"><a href="index.html#website-section" class="nav-link">WORKS</a></li>
                <li class="header-nav-item"><a href="about.html" class="nav-link">ABOUT</a></li>
                <li class="header-nav-item"><a href="contact.html" class="nav-link active">CONTACT</a></li>
                <li class="header-nav-item"><a href="others.html" class="nav-link">OTHERS</a></li>
            </ul>
        </nav>
        <a href="https://x.com/se_yakiimosan" target="_blank" rel="noopener noreferrer" class="social-link">X</a>
    </header>

    <!-- Main Content -->
    <main class="contact-page">
        <div class="contact-container">
            <div class="contact-content">
                <h1 class="slide__title">Create with AI?</h1>
                <p class="slide__subtitle">Vibe Codingを始めたい方は、お気軽にご相談ください。</p>
                <a href="https://note.com/yakiimo_blog/m/mee95f914c1b7" target="_blank" rel="noopener noreferrer" class="contact-link">
                    <span class="contact-link-text">記事を読む</span>
                    <span class="contact-link-arrow">→</span>
                </a>
                <div class="contact-divider"></div>
                <p class="contact-subtitle">Or email me at</p>
                <a id="contact-email-link" class="contact-email" href="#"></a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Custom Cursor and Email Obfuscation
        document.addEventListener('DOMContentLoaded', function() {
            // Custom Cursor
            const cursor = document.querySelector('.cursor-dot');
            const cursorOutline = document.querySelector('.cursor-dot-outline');

            document.addEventListener('mousemove', (e) => {
                const posX = e.clientX;
                const posY = e.clientY;
                cursor.style.left = `${posX}px`;
                cursor.style.top = `${posY}px`;
                cursorOutline.style.left = `${posX}px`;
                cursorOutline.style.top = `${posY}px`;
                if (cursor.style.opacity === '0') {
                    cursor.style.opacity = '1';
                    cursorOutline.style.opacity = '1';
                }
            });

            document.addEventListener('mouseleave', () => {
                cursor.style.opacity = '0';
                cursorOutline.style.opacity = '0';
            });

            // Cursor hover effects
            const hoverElements = document.querySelectorAll('a, button, .hover-element');
            hoverElements.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
                    cursorOutline.style.transform = 'translate(-50%, -50%) scale(1.5)';
                    cursorOutline.style.backgroundColor = 'rgba(0, 87, 255, 0.1)';
                });
                el.addEventListener('mouseleave', () => {
                    cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                    cursorOutline.style.transform = 'translate(-50%, -50%) scale(1)';
                    cursorOutline.style.backgroundColor = 'rgba(0, 87, 255, 0)';
                });
            });

            // Email Obfuscation
            const emailLink = document.getElementById('contact-email-link');
            if (emailLink) {
                const user = 'yakiimosan33';
                const domain = 'gmail.com';
                emailLink.href = `mailto:${user}@${domain}`;
                emailLink.textContent = `${user}@${domain}`;
            }
        });
    </script>
</body>
</html>
