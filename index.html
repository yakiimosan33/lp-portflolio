<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding Portfolio | LP制作事例</title>
    <meta name="description" content="Vibe Codingで制作したランディングページのポートフォリオサイト">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" class="loading">
        <div class="loading-content">
            <div class="loading-logo">Vibe Coding</div>
            <div class="loading-bar"></div>
        </div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor-dot-outline"></div>
    <div class="cursor-dot"></div>

    <!-- Header -->
    <header class="header">
        <a href="#" class="logo" onclick="location.reload()">Vibe Coding</a>
        <nav class="header-nav">
            <ul class="header-nav-list">
                <li class="header-nav-item"><a href="#works" class="nav-link">WORKS</a></li>
                <li class="header-nav-item"><a href="about.html" class="nav-link">ABOUT</a></li>
                <li class="header-nav-item"><a href="contact.html" class="nav-link">CONTACT</a></li>
            </ul>
        </nav>
        <a href="https://x.com/se_yakiimosan" target="_blank" rel="noopener noreferrer" class="social-link">X</a>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <div class="scroll-container">
            <div class="scroll-content">
                <!-- Hero Slide -->
                <div class="slide slide--first slide-hero">
                    <div class="slide__inner">
                        <h1 class="slide__title">Creative with AI</h1>
                        <p class="slide__portfolio-text">VIBE CODING'S PORTFOLIO SITE.</p>
                        <p class="slide__subtitle">
                            やきいも/AI Creator
                        </p>
                    </div>
                    <!-- Scroll Indicator -->
                    <div class="scroll-indicator">
                        <span class="scroll-text">SCROLL</span>
                        <div class="scroll-arrow"></div>
                    </div>
                </div>

                <!-- Portfolio Grid Slide -->
                <div class="slide portfolio-grid-slide" id="works">
                    <div class="slide__inner">
                        <h2 class="portfolio-section-title">LP（ランディングページ）</h2>
                        <div class="portfolio-grid">
                            <a href="https://lp-gemini-basic.vercel.app/" target="_blank" rel="noopener noreferrer" class="portfolio-grid-item">
                                <img src="pic/ai-creators-studio.png" alt="AI Creators Studio">
                                <div class="portfolio-grid-overlay">
                                    <span class="grid-project">LP</span>
                                    <span class="grid-title">AI Creators Studio</span>
                                </div>
                            </a>
                            <a href="https://food-delvery-lp.vercel.app/" target="_blank" rel="noopener noreferrer" class="portfolio-grid-item">
                                <img src="pic/food-del.png" alt="Food Delivery">
                                <div class="portfolio-grid-overlay">
                                    <span class="grid-project">LP</span>
                                    <span class="grid-title">Food Delivery</span>
                                </div>
                            </a>
                            <a href="https://saizeria-lp.vercel.app/" target="_blank" rel="noopener noreferrer" class="portfolio-grid-item">
                                <img src="pic/saiz-market.png" alt="Saize Marketing">
                                <div class="portfolio-grid-overlay">
                                    <span class="grid-project">LP</span>
                                    <span class="grid-title">Saize Marketing</span>
                                </div>
                            </a>
                            <a href="https://health-life-tan.vercel.app/" target="_blank" rel="noopener noreferrer" class="portfolio-grid-item">
                                <img src="pic/healthy-life.png" alt="Healthy Life">
                                <div class="portfolio-grid-overlay">
                                    <span class="grid-project">LP</span>
                                    <span class="grid-title">Healthy Life</span>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Store Sites Grid Slide -->
                <div class="slide portfolio-grid-slide">
                    <div class="slide__inner">
                        <h2 class="portfolio-section-title">Store（店舗サイト）</h2>
                        <div class="portfolio-grid">
                            <a href="https://hair-salon-sigma-sand.vercel.app/" target="_blank" rel="noopener noreferrer" class="portfolio-grid-item">
                                <img src="pic/hair-salon.png" alt="Hair Salon">
                                <div class="portfolio-grid-overlay">
                                    <span class="grid-project">店舗サイト</span>
                                    <span class="grid-title">Hair Salon</span>
                                </div>
                            </a>
                            <a href="https://lp-gemini-basic-esjy.vercel.app/" target="_blank" rel="noopener noreferrer" class="portfolio-grid-item">
                                <img src="pic/forest-cafe.png" alt="Forest Cafe">
                                <div class="portfolio-grid-overlay">
                                    <span class="grid-project">店舗サイト</span>
                                    <span class="grid-title">Forest Cafe</span>
                                </div>
                            </a>
                            <div class="portfolio-grid-item portfolio-placeholder">
                                <div class="placeholder-content">
                                    <span class="placeholder-text">coming soon</span>
                                </div>
                            </div>
                            <div class="portfolio-grid-item portfolio-placeholder">
                                <div class="placeholder-content">
                                    <span class="placeholder-text">coming soon</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Scrollbar -->
        <div class="scrollbar">
            <div class="scrollbar__handle"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <script src="https://unpkg.com/tilt.js@1.2.1/dest/tilt.jquery.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
