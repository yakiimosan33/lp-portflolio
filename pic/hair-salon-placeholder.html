<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; }
        .placeholder {
            width: 1920px;
            height: 1080px;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #333;
        }
        .title {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }
        .subtitle {
            font-size: 24px;
            font-weight: 200;
            color: #666;
            letter-spacing: 2px;
        }
        .type {
            margin-top: 40px;
            font-size: 18px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="title">LUMIERE</div>
        <div class="subtitle">Hair Salon</div>
        <div class="type">Store Site</div>
    </div>
</body>
</html>
